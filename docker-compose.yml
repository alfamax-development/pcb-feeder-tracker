services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: feederdb
    ports:
      - "5433:5432"
    volumes:
      - feederdb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    env_file: .env.docker
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  feederdb_data:
